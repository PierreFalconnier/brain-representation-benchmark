[project]
name = "representation_benchmark_project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fvcore>=0.1.5.post20221221",
    "huggingface-hub[hf-xet]>=0.30.2",
    "hydra-colorlog>=1.2.0",
    "hydra-core>=1.3.2",
    "lightning>=2.5.1",
    "mlxtend>=0.23.4",
    "monai>=1.3.2",
    "numpy<2.0",
    "open-clip-torch>=2.32.0",
    "rich>=15.0.0",
    "rootutils>=1.0.7",
    "timm>=1.0.20",
    "torchinfo>=1.8.0",
    "transformers>=4.51.2",
    "pacmap>=0.9.1",
    "scikit-learn>=1.6.0,<2.0.0",
    "tqdm-joblib>=0.0.5",
    "umap-learn>=0.5.12",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = [
    "ruff>=0.11.5",
]

[project.optional-dependencies]
cpu = [
  "torch>=2.11,<2.12",
  "torchvision>=0.26,<0.27",
]
cu121 = [
  "torch==2.5.1",
  "torchvision==0.20.1",
]
cu126 = [
  "torch>=2.11,<2.12",
  "torchvision>=0.26,<0.27",
]
cu128 = [
  "torch>=2.11,<2.12",
  "torchvision>=0.26,<0.27",
]
cu130 = [
  "torch>=2.11,<2.12",
  "torchvision>=0.26,<0.27",
]
submodules = [
  "dynamic-network-architectures",
  "mednextv1",
  "fomo-code",  
 ]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.11,<0.12"
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cu121" },
    { extra = "cu126" },
    { extra = "cu128" },
    { extra = "cu130" },
  ],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu121", extra = "cu121" },
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu126", extra = "cu126" },
  { index = "pytorch-cu128", extra = "cu128" },
  { index = "pytorch-cu130", extra = "cu130" },
]
torchvision = [
  { index = "pytorch-cu121", extra = "cu121" },
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu126", extra = "cu126" },
  { index = "pytorch-cu128", extra = "cu128" },
  { index = "pytorch-cu130", extra = "cu130" },
]
mednextv1 = { git = "https://github.com/FrancescoLR/MedNeXt.git" }
fomo-code = { path = "submodules/fomo-code", editable = true }  # first, do git submodule add -b docker-alps https://github.com/jbanusco/fomo-code submodules/fomo-code

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
